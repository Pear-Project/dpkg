name: Build changed packages and publish to debian-package-repo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Every push triggers its own independent run, and matrix max-parallel only
# serializes jobs *within* one run - two runs from back-to-back pushes can
# still race to publish to debian-package-repo at the same time. publish.sh's
# git-pull-rebase retry only survives a clean fast-forward; two runs
# regenerating the same directory's Packages/Release concurrently produce a
# real rebase conflict it can't resolve. Serialize entire runs instead.
concurrency:
  group: publish-debian-package-repo
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.changed.outputs.dirs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find package dirs with a version bump
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [[ -z "$before" ]] || [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            before=$(git rev-parse --verify -q HEAD~1 2>/dev/null || echo "")
          fi

          read_version() {
            # $1 = DEBBUILD contents, echoes "pkgver-pkgrel"
            ( set -e
              eval "$(printf '%s\n' "$1" | grep -E '^\s*pkgver=|^\s*pkgrel=')"
              printf '%s-%s' "$pkgver" "$pkgrel"
            )
          }

          result=()

          if [[ -z "$before" ]]; then
            # No usable prior commit (e.g. first push to a brand-new repo).
            # `git show ":$dir/DEBBUILD"` would read the *current* index
            # here instead of failing, so don't go through the diff path at
            # all - just build everything that currently has a DEBBUILD.
            candidates=$(find . -maxdepth 2 -name DEBBUILD -printf '%h\n' | sed 's#^\./##' | sort -u)
            for dir in $candidates; do
              [[ -f "$dir/DEBBUILD" ]] || continue
              newcontents=$(cat "$dir/DEBBUILD")
              newver=$(read_version "$newcontents") || { echo "Skip $dir: cannot parse DEBBUILD" >&2; continue; }
              echo "New package dir (no prior commit to diff against): $dir ($newver)"
              result+=("$dir")
            done
          else
            candidates=$(git diff --name-only "$before" HEAD -- '*/DEBBUILD' | xargs -n1 dirname 2>/dev/null | sort -u)
            for dir in $candidates; do
              [[ -f "$dir/DEBBUILD" ]] || continue
              newcontents=$(cat "$dir/DEBBUILD")
              newver=$(read_version "$newcontents") || { echo "Skip $dir: cannot parse new DEBBUILD" >&2; continue; }

              oldcontents=$(git show "$before:$dir/DEBBUILD" 2>/dev/null || true)
              if [[ -z "$oldcontents" ]]; then
                echo "New package dir: $dir ($newver)"
                result+=("$dir")
                continue
              fi

              oldver=$(read_version "$oldcontents") || { echo "Skip $dir: cannot parse old DEBBUILD" >&2; continue; }

              if [[ "$newver" == "$oldver" ]]; then
                echo "Skip $dir: version unchanged ($newver)"
                continue
              fi

              if dpkg --compare-versions "$newver" gt "$oldver"; then
                echo "Bumped: $dir ($oldver -> $newver)"
                result+=("$dir")
              else
                echo "Skip $dir: version did not increase ($oldver -> $newver)"
              fi
            done
          fi

          json=$(printf '%s\n' "${result[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Package dirs to build:"
          echo "$json"
          echo "dirs=$json" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.dirs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # debian-package-repo is a shared git checkout pushed to at the end of
      # each matrix job; keep this serial until publish.sh's retry-on-push
      # has proven itself under real concurrency.
      max-parallel: 1
      fail-fast: false
      matrix:
        pkgdir: ${{ fromJson(needs.detect-changes.outputs.dirs) }}

    container:
      image: debian:testing

    steps:
      # actions/checkout needs `git` in the container before it can run.
      - name: Install git (required before checkout works in-container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout dpkg (this repo)
        uses: actions/checkout@v4

      # actions/checkout refuses any `path:` outside $GITHUB_WORKSPACE, so a
      # true sibling checkout (`../debian-package-repo`, like the local dev
      # layout) isn't possible in-CI. Nest it instead; publish.sh takes the
      # repo path as an argument either way.
      - name: Checkout debian-package-repo
        uses: actions/checkout@v4
        with:
          repository: Pear-Project/debian-package-repo
          path: debian-package-repo
          token: ${{ secrets.DEBIAN_REPO_DEPLOY_TOKEN }}

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential dpkg-dev apt-utils gnupg2 file

      - name: Build package
        run: ./build-pkg.sh "${{ matrix.pkgdir }}"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" > /tmp/.gpg-passphrase
          chmod 600 /tmp/.gpg-passphrase

      - name: Configure git identity for the publish commit
        working-directory: debian-package-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sign, update apt metadata, publish, push
        env:
          GPG_PASSPHRASE_FILE: /tmp/.gpg-passphrase
        run: |
          ./publish.sh "${{ matrix.pkgdir }}" \
            --repo debian-package-repo \
            --channel main \
            --release latest \
            --push

      - name: Clean up passphrase
        if: always()
        run: rm -f /tmp/.gpg-passphrase
