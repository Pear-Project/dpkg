name: Build changed packages and publish to debian-package-repo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Every push triggers its own independent run, and matrix max-parallel only
# serializes jobs *within* one run - two runs from back-to-back pushes can
# still race to publish to debian-package-repo at the same time. publish.sh's
# git-pull-rebase retry only survives a clean fast-forward; two runs
# regenerating the same directory's Packages/Release concurrently produce a
# real rebase conflict it can't resolve. Serialize entire runs instead.
concurrency:
  group: publish-debian-package-repo
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      dirs_amd64: ${{ steps.changed.outputs.dirs_amd64 }}
      dirs_arm64: ${{ steps.changed.outputs.dirs_arm64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find package dirs with a version bump
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [[ -z "$before" ]] || [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            before=$(git rev-parse --verify -q HEAD~1 2>/dev/null || echo "")
          fi

          read_version() {
            # $1 = DEBBUILD contents, echoes "pkgver-pkgrel"
            ( set -e
              eval "$(printf '%s\n' "$1" | grep -E '^\s*pkgver=|^\s*pkgrel=')"
              printf '%s-%s' "$pkgver" "$pkgrel"
            )
          }

          result=()

          if [[ -z "$before" ]]; then
            # No usable prior commit (e.g. first push to a brand-new repo).
            # `git show ":$dir/DEBBUILD"` would read the *current* index
            # here instead of failing, so don't go through the diff path at
            # all - just build everything that currently has a DEBBUILD.
            candidates=$(find . -maxdepth 2 -name DEBBUILD -printf '%h\n' | sed 's#^\./##' | sort -u)
            for dir in $candidates; do
              [[ -f "$dir/DEBBUILD" ]] || continue
              newcontents=$(cat "$dir/DEBBUILD")
              newver=$(read_version "$newcontents") || { echo "Skip $dir: cannot parse DEBBUILD" >&2; continue; }
              echo "New package dir (no prior commit to diff against): $dir ($newver)"
              result+=("$dir")
            done
          else
            candidates=$(git diff --name-only "$before" HEAD -- '*/DEBBUILD' | xargs -n1 dirname 2>/dev/null | sort -u)
            for dir in $candidates; do
              [[ -f "$dir/DEBBUILD" ]] || continue
              newcontents=$(cat "$dir/DEBBUILD")
              newver=$(read_version "$newcontents") || { echo "Skip $dir: cannot parse new DEBBUILD" >&2; continue; }

              oldcontents=$(git show "$before:$dir/DEBBUILD" 2>/dev/null || true)
              if [[ -z "$oldcontents" ]]; then
                echo "New package dir: $dir ($newver)"
                result+=("$dir")
                continue
              fi

              oldver=$(read_version "$oldcontents") || { echo "Skip $dir: cannot parse old DEBBUILD" >&2; continue; }

              if [[ "$newver" == "$oldver" ]]; then
                echo "Skip $dir: version unchanged ($newver)"
                continue
              fi

              if dpkg --compare-versions "$newver" gt "$oldver"; then
                echo "Bumped: $dir ($oldver -> $newver)"
                result+=("$dir")
              else
                echo "Skip $dir: version did not increase ($oldver -> $newver)"
              fi
            done
          fi

          # Split by declared arch=() so each dir only builds on the
          # runner(s) it actually supports. arch=('all') is architecture-
          # independent - it's built once on the amd64 job and publish.sh
          # already copies it into both x86_64 and aarch64 dirs, so it's
          # deliberately NOT added to dirs_arm64 too (that would just be a
          # redundant duplicate build+publish of the same .deb).
          amd64=()
          arm64=()
          for dir in "${result[@]}"; do
            archline=$(grep -E '^\s*arch=' "$dir/DEBBUILD" || true)
            if [[ "$archline" == *all* ]]; then
              amd64+=("$dir")
            else
              [[ "$archline" == *amd64* ]] && amd64+=("$dir")
              [[ "$archline" == *arm64* ]] && arm64+=("$dir")
            fi
          done

          json_amd64=$(printf '%s\n' "${amd64[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          json_arm64=$(printf '%s\n' "${arm64[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "amd64: $json_amd64"
          echo "arm64: $json_arm64"
          echo "dirs_amd64=$json_amd64" >> "$GITHUB_OUTPUT"
          echo "dirs_arm64=$json_arm64" >> "$GITHUB_OUTPUT"

  build-and-publish-amd64:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.dirs_amd64 != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      # debian-package-repo is a shared git checkout pushed to at the end of
      # each matrix job; keep this serial until publish.sh's retry-on-push
      # has proven itself under real concurrency.
      max-parallel: 1
      fail-fast: false
      matrix:
        pkgdir: ${{ fromJson(needs.detect-changes.outputs.dirs_amd64) }}

    container:
      image: ubuntu:24.04

    steps:
      # actions/checkout needs `git` in the container before it can run.
      - name: Install git (required before checkout works in-container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout dpkg (this repo)
        uses: actions/checkout@v4

      # actions/checkout refuses any `path:` outside $GITHUB_WORKSPACE, so a
      # true sibling checkout (`../debian-package-repo`, like the local dev
      # layout) isn't possible in-CI. Nest it instead; publish.sh takes the
      # repo path as an argument either way.
      - name: Checkout debian-package-repo
        uses: actions/checkout@v4
        with:
          repository: Pear-Project/debian-package-repo
          path: debian-package-repo
          token: ${{ secrets.DEBIAN_REPO_DEPLOY_TOKEN }}

      # pearOS's real target is KDE neon Unstable Edition (Ubuntu 24.04),
      # and its kwin-wayland/kwin-dev come from neon's own unstable repo
      # (continuous git builds), not from Ubuntu or Debian. A kwin effect
      # plugin's Qt plugin IID bakes in KWIN_PLUGIN_VERSION_STRING from
      # whatever kwin-dev built it, so building against the wrong kwin-dev
      # produces a .so that compiles fine but KWin silently refuses to
      # load on a real pearOS system. Match the real base exactly.
      - name: Add KDE neon unstable apt repo (matches pearOS's real KWin ABI)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gnupg wget
          mkdir -p /etc/apt/keyrings
          wget -qO- https://origin.archive.neon.kde.org/public.key | gpg --dearmor -o /etc/apt/keyrings/neon-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/neon-archive-keyring.gpg] http://archive.neon.kde.org/unstable noble main" > /etc/apt/sources.list.d/neon.list
          apt-get update

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential dpkg-dev apt-utils gnupg2 file

      - name: Build package
        run: ./build-pkg.sh "${{ matrix.pkgdir }}"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" > /tmp/.gpg-passphrase
          chmod 600 /tmp/.gpg-passphrase

      - name: Configure git identity for the publish commit
        working-directory: debian-package-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sign, update apt metadata, publish, push
        env:
          GPG_PASSPHRASE_FILE: /tmp/.gpg-passphrase
        run: |
          ./publish.sh "${{ matrix.pkgdir }}" \
            --repo debian-package-repo \
            --channel main \
            --release latest \
            --push

      - name: Clean up passphrase
        if: always()
        run: rm -f /tmp/.gpg-passphrase

  build-and-publish-arm64:
    # Runs after the amd64 job (not in parallel with it) purely to keep
    # publish.sh's git-push-retry story simple - two jobs racing to push to
    # debian-package-repo at once is more retry-storm risk than it's worth.
    needs: [detect-changes, build-and-publish-amd64]
    if: ${{ always() && needs.detect-changes.outputs.dirs_arm64 != '[]' && needs.build-and-publish-amd64.result != 'failure' }}
    # Free hosted Arm64 runner - GA for public repos, no QEMU/cross-compile
    # needed since it's native hardware.
    runs-on: ubuntu-24.04-arm
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        pkgdir: ${{ fromJson(needs.detect-changes.outputs.dirs_arm64) }}

    # KDE neon (used on amd64, see that job) has never published an arm64
    # track - archive.neon.kde.org/unstable's arm64 Packages index doesn't
    # carry kwin-dev or libkdecorations3-dev at all. Left on debian:testing
    # here, same as before this fix: it does have both packages, matching
    # the state the arm64 job was already in before this change. Whether
    # that's the correct KWin ABI for real arm64 pearOS devices is still
    # unverified - unlike amd64, there's no known-good arm64 pearOS
    # machine this was cross-checked against.
    container:
      image: debian:testing

    steps:
      - name: Install git (required before checkout works in-container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout dpkg (this repo)
        uses: actions/checkout@v4

      - name: Checkout debian-package-repo
        uses: actions/checkout@v4
        with:
          repository: Pear-Project/debian-package-repo
          path: debian-package-repo
          token: ${{ secrets.DEBIAN_REPO_DEPLOY_TOKEN }}

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential dpkg-dev apt-utils gnupg2 file

      - name: Build package
        run: ./build-pkg.sh "${{ matrix.pkgdir }}"

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" > /tmp/.gpg-passphrase
          chmod 600 /tmp/.gpg-passphrase

      - name: Configure git identity for the publish commit
        working-directory: debian-package-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sign, update apt metadata, publish, push
        env:
          GPG_PASSPHRASE_FILE: /tmp/.gpg-passphrase
        run: |
          ./publish.sh "${{ matrix.pkgdir }}" \
            --repo debian-package-repo \
            --channel main \
            --release latest \
            --push

      - name: Clean up passphrase
        if: always()
        run: rm -f /tmp/.gpg-passphrase
